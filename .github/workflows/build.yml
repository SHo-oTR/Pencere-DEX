name: Rust Windows Derleme

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Windows x86_64 Derleme
    runs-on: windows-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Rust Toolchain Kur
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Release Modunda Derle
        run: cargo build --release --verbose

      - name: Derleme Çıktısını Kontrol Et
        run: |
          Get-Item .\target\release\pencere_dex.exe | Select-Object Name, Length, LastWriteTime

      - name: Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: pencere_dex-windows-x86_64
          path: target/release/pencere_dex.exe
          if-no-files-found: error

      - name: GitHub Release Oluştur (Tag Varsa)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/pencere_dex.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
